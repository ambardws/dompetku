name: 🤖 Incident Response Agent

# ─────────────────────────────────────────────────────────────
# Trigger: dipanggil oleh workflow CI utama saat ada kegagalan
# Input:   failure_phase, failure_logs, job_name dari ci.yml
# Output:  notifikasi ke Telegram Dev Bot
# ─────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      failure_phase:
        description: 'Phase yang gagal: test | build | sonar | deploy'
        required: true
        type: string
      failure_logs:
        description: 'Error log snippet (max 3000 chars)'
        required: false
        type: string
        default: ''
      job_name:
        description: 'Nama job yang gagal'
        required: false
        type: string
        default: 'unknown'

  # Bisa juga di-trigger manual untuk testing
  workflow_dispatch:
    inputs:
      failure_phase:
        description: 'Phase untuk simulasi kegagalan'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - build
          - sonar
          - deploy

jobs:
  notify-incident:
    name: 🚨 Analyze & Notify
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Butuh 2 commit untuk git diff

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🤖 Run Incident Response Agent
        env:
          # Dev Bot credentials (BEDA dari bot Dompetku user app)
          TELEGRAM_DEV_BOT_TOKEN: ${{ secrets.TELEGRAM_DEV_BOT_TOKEN }}
          TELEGRAM_DEV_CHAT_ID:   ${{ secrets.TELEGRAM_DEV_CHAT_ID }}

          # GitHub context (otomatis tersedia)
          GITHUB_REPOSITORY:      ${{ github.repository }}
          GITHUB_RUN_ID:          ${{ github.run_id }}
          GITHUB_SHA:             ${{ github.sha }}
          GITHUB_REF_NAME:        ${{ github.ref_name }}
          GITHUB_ACTOR:           ${{ github.actor }}
          GITHUB_EVENT_NAME:      ${{ github.event_name }}

          # Failure context dari caller
          CI_JOB_NAME:            ${{ inputs.job_name }}
          CI_FAILURE_PHASE:       ${{ inputs.failure_phase }}
          CI_FAILURE_LOGS:        ${{ inputs.failure_logs }}
        run: node scripts/incident-agent.mjs
